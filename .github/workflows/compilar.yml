name: Compilar alquiler

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar
        run: javac -d out src/*.java

      - name: Ejecutar
        run: java -cp out Main
